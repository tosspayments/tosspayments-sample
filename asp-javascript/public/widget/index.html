<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://static.toss.im/icons/png/4x/icon-toss-logo.png" />
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결제위젯 방식 비교</title>
    <!-- SDK 추가 -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
  </head>

  <body>
    <script>
      // TODO: clientKey는 개발자센터의 결제위젯 연동 키 > 클라이언트 키로 바꾸세요.
      // @docs https://docs.tosspayments.com/sdk/v2/js#토스페이먼츠-초기화
      const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
      const currentURL = window.location.href.replace(/[^/]*$/, '');
      const generateRandomString = () => window.btoa(Math.random()).slice(0, 20);
    </script>

    <div style="display: flex; gap: 30px; max-width: 1200px; margin: 0 auto; padding: 0 16px">

      <!-- 주문서형 결제 -->
      <div class="wrapper" style="flex: 1; display: flex">
        <div class="box_section" style="padding: 40px 30px 50px 30px; margin-top: 30px; margin-bottom: 50px; flex: 1">
          <h2 class="title">주문서형 결제</h2>
          <p style="margin: 8px 0 24px; color: #8b95a1; font-size: 14px">주문서 안에서 결제 방법 선택(checkout.html)</p>
          <!-- 결제 UI -->
          <div id="payment-method"></div>
          <!-- 이용약관 UI -->
          <div id="agreement"></div>
          <!-- 쿠폰 체크박스 -->
          <div style="padding-left: 30px">
            <div class="checkable typography--p">
              <label for="coupon-box" class="checkable__label typography--regular">
                <input id="coupon-box" class="checkable__input" type="checkbox" aria-checked="true" />
                <span class="checkable__label-text">5,000원 쿠폰 적용</span>
              </label>
            </div>
          </div>
          <!-- 결제하기 버튼 -->
          <button class="button" id="payment-button" style="margin-top: 30px">결제하기</button>
        </div>
      </div>

      <script>
        {
          const amount = { currency: "KRW", value: 50000 };

          // ------  결제위젯 초기화 ------
          // TODO: 구매자의 고유 아이디를 불러와서 customerKey로 설정하세요. 이메일・전화번호와 같이 유추가 가능한 값은 안전하지 않습니다.
          // @docs https://docs.tosspayments.com/sdk/v2/js#토스페이먼츠-초기화
          const widgets = TossPayments(clientKey).widgets({ customerKey: generateRandomString() });
          // 비회원 결제
          // const widgets = TossPayments(clientKey).widgets({ customerKey: TossPayments.ANONYMOUS });

          // ------  주문서의 결제 금액 설정 ------
          // @docs https://docs.tosspayments.com/sdk/v2/js#widgetssetamount
          widgets.setAmount(amount).then(() =>
            Promise.all([
              // ------  결제 UI 렌더링 ------
              // @docs https://docs.tosspayments.com/sdk/v2/js#widgetsrenderpaymentmethods
              widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
              // ------  이용약관 UI 렌더링 ------
              // @docs https://docs.tosspayments.com/sdk/v2/js#widgetsrenderagreement
              widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" }),
            ])
          );

          // ------  주문서의 결제 금액이 변경되었을 경우 결제 금액 업데이트 ------
          // @docs https://docs.tosspayments.com/sdk/v2/js#widgetssetamount
          document.getElementById("coupon-box").addEventListener("change", async function () {
            await widgets.setAmount({
              currency: "KRW",
              value: this.checked ? amount.value - 5000 : amount.value,
            });
          });

          // ------ '결제하기' 버튼 누르면 결제창 띄우기 ------
          // @docs https://docs.tosspayments.com/sdk/v2/js#widgetsrequestpayment
          document.getElementById("payment-button").addEventListener("click", async function () {
            // 결제를 요청하기 전에 orderId, amount를 서버에 저장하세요.
            // 결제 과정에서 악의적으로 결제 금액이 바뀌는 것을 확인하는 용도입니다.
            await widgets.requestPayment({
              orderId: generateRandomString(),
              orderName: "토스 티셔츠 외 2건",
              successUrl: currentURL + "success.asp",
              failUrl: currentURL + "fail.asp",
              customerEmail: "customer123@gmail.com",
              customerName: "김토스",
              // 가상계좌 안내, 퀵계좌이체 휴대폰 번호 자동 완성에 사용되는 값입니다. 필요하다면 주석을 해제해 주세요.
              // customerMobilePhone: "01012341234",
            });
          });
        }
      </script>

      <!-- 결제창형 결제 -->
      <div class="wrapper" style="flex: 1; display: flex">
        <div class="box_section" style="padding: 40px 30px 50px 30px; margin-top: 30px; margin-bottom: 50px; flex: 1; display: flex; flex-direction: column">
          <h2 class="title">결제창형 결제</h2>
          <p style="margin: 8px 0 24px; color: #8b95a1; font-size: 14px">결제하기 버튼을 눌러 결제창 열기(checkout-window.html)</p>
          <!-- 주문서형과 높이를 맞추기 위한 플레이스홀더 -->
          <div style="flex: 1; border: 2px dashed #d1d5db; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; gap: 8px; color: #8b95a1;">
            <span style="font-size: 14px; font-weight: 600;">결제수단 선택 UI 없음</span>
            <span style="font-size: 13px; text-align: center;">버튼 누르면 결제수단을 선택할 수 있는 결제창이 열립니다.</span>
          </div>
          <!-- 결제하기 버튼 -->
          <button class="button" id="payment-window-button" style="margin-top: 30px">결제하기</button>
        </div>
      </div>

      <script>
        {
          // ------  결제위젯 초기화 ------
          // TODO: 구매자의 고유 아이디를 불러와서 customerKey로 설정하세요. 이메일・전화번호와 같이 유추가 가능한 값은 안전하지 않습니다.
          // @docs https://docs.tosspayments.com/sdk/v2/js#토스페이먼츠-초기화
          const widgetWindow = TossPayments(clientKey).widgets({ customerKey: generateRandomString() });
          // 비회원 결제
          // const widgetWindow = TossPayments(clientKey).widgets({ customerKey: TossPayments.ANONYMOUS });

          // ------ '결제하기' 버튼 누르면 결제창 띄우기 ------
          document.getElementById("payment-window-button").addEventListener("click", async () => {
            // ------  주문서의 결제 금액 설정 ------
            // @docs https://docs.tosspayments.com/sdk/v2/js#widgetssetamount
            await widgetWindow.setAmount({ currency: "KRW", value: 50000 });

            // ------  결제창 렌더링 ------
            // @docs https://docs.tosspayments.com/sdk/v2/js#widgetsrenderpaymentwindow
            const widgetPaymentWindow = await widgetWindow.renderPaymentWindow({
              variantKey: {
                paymentMethod: "DEFAULT",
                agreement: "AGREEMENT",
              },
            });

            // 구매자가 결제창에서 결제 요청 버튼을 누르면 발생하는 이벤트
            widgetPaymentWindow.on("paymentRequest", async () => {
              try {
                // 결제를 요청하기 전에 orderId, amount를 서버에 저장하세요.
                // 결제 과정에서 악의적으로 결제 금액이 바뀌는 것을 확인하는 용도입니다.
                await widgetWindow.requestPayment({
                  orderId: generateRandomString(),
                  orderName: "토스 티셔츠 외 2건",
                  successUrl: currentURL + "success.asp",
                  failUrl: currentURL + "fail.asp",
                  customerEmail: "customer123@gmail.com",
                  customerName: "김토스",
                  // 가상계좌 안내, 퀵계좌이체 휴대폰 번호 자동 완성에 사용되는 값입니다. 필요하다면 주석을 해제해 주세요.
                  customerMobilePhone: "01012341234",
                });
              } catch (error) {
                console.error(error);
              }

              // 가맹점이 원하는 시점에 결제창을 제거하세요 (결제 완료 후, 일정 시간 후 등).
              await widgetPaymentWindow.destroy();
            });
          });
        }
      </script>

    </div>

    <!-- 다른 연동 방식으로 이동하기 -->
    <div class="wrapper">
      <div class="box_section" style="padding: 40px 30px 50px 30px; margin-top: 30px; margin-bottom: 50px">
        <!-- 결제창만 연동하기 -->
        <button class="button" id="nav-payment-button" style="margin-top: 30px">위젯 없이 결제창만 연동하기</button>
      </div>
    </div>
    <script>
      document.getElementById("nav-payment-button").addEventListener("click", () => {
        location.href = "/public/payment/index.html";
      });
    </script>
  </body>
</html>
